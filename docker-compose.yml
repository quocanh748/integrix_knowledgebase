services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: integrix_pgvector
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${PG_DATABASE:-integrix_rag}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgrespassword}
    volumes:
      - pgvector_data:/var/lib/postgresql/data

volumes:
  pgvector_data:
